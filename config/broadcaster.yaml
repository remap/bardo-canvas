target_url: "https://localhost:8443/"
capture_backend: "sck"                          # "cdp" | "sck"
sck_display_mode: "virtual"                     # "virtual" | "physical" -- required if capture_backend: sck
sck_virtual_display_name: "Layout Driver Virtual Display"  # sck + virtual only
sck_physical_display_name: null                 # sck + physical only -- substring-matched against connected display names
ndi_source_name: "Layout Driver"
width: 3840
height: 2160
fps: 30
healthz_timeout_seconds: 30.0
timecode_enabled: true                          # burn-in hh:mm:ss:ff overlay for monitoring
timecode_position: "top"                        # "top" | "bottom"
control_window_url: null                        # sck only; e.g. "https://localhost:8444/layout-control" -- null opens nothing
control_display_name: null                      # substring-matched against connected display names, e.g. "Retina" -- null falls back to whatever NSScreen reports as the main screen (unreliable, set this explicitly)
control_window_width: 1200
control_window_height: 600
