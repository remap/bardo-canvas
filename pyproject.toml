[project]
name = "layout-driver"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "pillow>=11.0",
    "sounddevice>=0.5",
    "cyndilib>=0.0.9",
    "playwright>=1.48",
    "httpx>=0.27",
    "cryptography>=43.0",
    "numpy>=2.1",
    "pyobjc-core>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-ScreenCaptureKit>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-CoreMedia>=10.3; sys_platform == 'darwin'",
]

[project.optional-dependencies]
flux-gallery = [
    "google-genai>=1.0",
    "diffusers>=0.31",
    "transformers>=4.46",
    "accelerate>=1.1",
    "sentencepiece>=0.2",
    "torch>=2.5",
    "fal-client>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
pythonpath = ["apps/flux-gallery"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py313"
# docs/ holds the historical specs and plans; ruff format would otherwise rewrite the
# Python samples embedded in that record every time it runs over the whole repo.
extend-exclude = ["docs/"]

[tool.hatch.build.targets.wheel]
packages = ["layout_server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
